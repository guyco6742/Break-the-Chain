name: Release

on:
  push:
    tags: ['v*']

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package for the Chrome Web Store
        run: |
          cd dist
          zip -r ../break-the-chain-${{ github.ref_name }}.zip . -x '.*'
          # A second copy under a fixed name, so
          # /releases/latest/download/break-the-chain.zip is a permanent
          # download link that never has to be edited when the version changes.
          cp ../break-the-chain-${{ github.ref_name }}.zip ../break-the-chain.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            break-the-chain-*.zip
            break-the-chain.zip
