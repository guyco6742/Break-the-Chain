<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Break the Chain</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <h1>Break the Chain</h1>
      <button id="options" class="icon" title="Settings" aria-label="Settings">⚙</button>
    </header>

    <p id="site" class="site"></p>

    <section id="grant" class="notice" hidden>
      <p>This extension needs permission to request the URLs it finds. Nothing is uploaded anywhere — every request goes straight from your browser to the site.</p>
      <button id="grant-btn" class="primary">Grant access</button>
    </section>

    <section id="controls">
      <div class="row">
        <button id="scan-page" class="primary">Scan this page</button>
        <button id="scan-site">Crawl site</button>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <p id="status" class="status">Ready.</p>
      <ul id="totals" class="totals"></ul>
      <div class="row">
        <button id="report">Full report</button>
        <button id="recheck">Re-check failures</button>
      </div>
      <div class="row">
        <button id="stop">Stop</button>
        <button id="clear">Clear highlights</button>
      </div>
    </section>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
